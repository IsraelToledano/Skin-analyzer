<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#FAF7F4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;}
  input,select,textarea{outline:none;}
  /* One place for the interaction polish, so every button in the app gets
     the same feel without each component repeating transition rules: a
     quick ease on hover/press state, and a real press response on touch
     (mobile has no hover, so the pressed state is what reads as tactile). */
  button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .1s ease,box-shadow .16s ease;}
  button:active{transform:scale(0.975);}
  @media (hover:hover){button:hover{filter:brightness(0.985);}}
  /* Panels that expand in place (Last used, Why isn't this scheduled) slide
     open instead of appearing abruptly. prefers-reduced-motion is honoured. */
  @keyframes sr-expand{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .sr-expand{animation:sr-expand .18s ease both;}
  /* Narrow phones (iPhone SE and similar, 320px): the one-row calendar
     controls only fit if the weekday is dropped from the date. */
  @media (max-width:350px){.sr-date-wd{display:none;}}
  @media (prefers-reduced-motion:reduce){.sr-expand{animation:none;}button{transition:none;}button:active{transform:none;}}
  ::placeholder{color:#9E8E87;opacity:0.7;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:#EDE8E3;border-radius:2px;}
  #root{min-height:100vh;}
  #boot-status{position:fixed;inset:0;background:#FAF7F4;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:-apple-system,sans-serif;padding:24px;text-align:center;z-index:9999;}

  #boot-status .spinner{width:28px;height:28px;border:3px solid #EDE8E3;border-top-color:#E8837A;border-radius:50%;animation:spin 0.8s linear infinite;}

<div id="boot-status">
  <div class="spinner"></div>

<!-- React + ReactDOM (UMD production builds) — no Babel needed, JSX is pre-compiled below -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script>
  // Visible failure handling: if React/ReactDOM fail to load (CDN blocked, network issue),
  // or if the app throws while mounting, show the actual error instead of a silent blank screen.
  window.addEventListener('error', function(e){
    var el = document.getElementById('boot-error');
    if(el){
      el.style.display = 'block';
      el.textContent = 'Error: ' + (e.message || e.error || 'unknown') +
        (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '');
    }
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(typeof React === 'undefined' || typeof ReactDOM === 'undefined'){
        var el = document.getElementById('boot-error');
        if(el){
          el.style.display = 'block';
          el.textContent = 'React failed to load from unpkg.com.\nCheck your internet connection and try again.\nIf this keeps happening, your network may be blocking unpkg.com.';
        }
      }
    }, 4000);
  });
</script>

<script>
const {
  useState,
  useRef,
  useEffect,
  useCallback,
  useMemo,
  useLayoutEffect
} = React;

// ─── THEME (matches the Claude.ai / Skin Ritual artifact) ─────────────────────
const T = {
  bg: "#FAF7F4",
  card: "#FFFFFF",
  border: "#EDE8E3",
  accent: "#E8837A",
  accentSoft: "#E8837A18",
  peach: "#F2A98A",
  peachSoft: "#F2A98A15",
  text: "#2C2420",
  muted: "#9E8E87",
  faint: "#F5F0EC",
  green: "#5BAA82",
  greenSoft: "#5BAA8215",
  red: "#D95F5F",
  redSoft: "#D95F5F12",
  blue: "#6B9FBF",
  blueSoft: "#6B9FBF15",
  purple: "#9B8ABF",
  purpleSoft: "#9B8ABF15",
  orange: "#E8A87A",
  orangeSoft: "#E8A87A15",
  // Layered rather than single-blur: a tight contact shadow plus a wide
  // soft one reads as a card resting on the surface instead of a flat box
  // with a grey halo.
  shadow: "0 1px 2px rgba(44,36,32,0.04), 0 4px 16px rgba(44,36,32,0.05)",
  shadowMd: "0 2px 6px rgba(44,36,32,0.07), 0 12px 32px rgba(44,36,32,0.10)",

  // a subtle sheen without tinting them.
  gloss: "linear-gradient(180deg,#FFFFFF 0%,#FDFBF9 100%)"
};

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const STORAGE_KEY = "skinritual_v4"; // same key/version as the Claude.ai version's export format
// Bump this on every push so it's obvious whether a device has the latest code.
// Format: YYYY-MM-DD.N (N = push count that day, resets each day)
const APP_VERSION = "2026-09-24.4";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const SKIN_TYPES = ["Dry", "Oily", "Combination", "Normal", "Sensitive", "Acne-prone"];
const CONCERNS = ["Acne / Breakouts", "Blackheads / Whiteheads", "Oiliness", "Dryness / Flakiness", "Sensitivity / Redness", "Hyperpigmentation", "Dark spots / Melasma", "Fine lines / Wrinkles", "Enlarged pores", "Dullness / Texture", "Dark circles", "Sagging / Firmness", "Rosacea", "Eczema / Psoriasis", "Scarring"];
const FREQS = {
  daily: "Daily",
  "twice-weekly": "2×/week",
  weekly: "Weekly",
  "bi-weekly": "Every 2 wks",
  monthly: "Monthly",
  "6-weekly": "Every 6 wks",
  "8-weekly": "Every 8 wks"
};
const FREQ_DAYS = {
  daily: 1,
  "twice-weekly": 3,
  weekly: 7,
  "bi-weekly": 14,
  monthly: 30,
  "6-weekly": 42,
  "8-weekly": 56
};
// ─── CATEGORY-DRIVEN CONFLICT SYSTEM ───────────────────────────────────────
// Previously, "does this product conflict with a retinoid" was answered by
// THREE separately-maintained keyword lists (CONFLICT_PAIRS' own literal
// acid-name pairs, ACTIVE_GROUP_RULES' keyword-per-group list, and
// productCategories/INGREDIENT_CATEGORIES used for Products-tab display) —
// and they drifted out of sync with each other. Concretely: ACTIVE_GROUP_
// RULES' exfoliant group already included "microfoliant" (fixed for a
// rest-night-cooldown gap), but CONFLICT_PAIRS — the list that actually
// gates same-night placement — only ever paired retinol against literal
// acid names ("glycolic acid", "aha", "bha", "lactic acid", "salicylic
// acid"), never "microfoliant"/"exfoliant"/"peeling"/generic exfoliant
// terms. Result: Dermalogica Daily Microfoliant (a real, currently-
// scheduled "best"-tagged exfoliant) could land on the SAME PM night as a
// retinoid with nothing blocking it, because the one list that actually
// enforces same-night conflicts never recognized it as an exfoliant at
// all — this is what the "retinol and exfoliant same night" report traced
// back to. Same root cause as the earlier "détox" vs "detox" accent bug in
// RANK_DATA: a hand-maintained keyword list that has to be kept in sync
// with everything else by hand, and eventually isn't.
// Fix: ONE canonical per-product-TYPE classifier (productCategories,
// already used for Products-tab grouping — the most complete list, since
// it already covers "microfoliant", "a313"/"pommade" as retinoid synonyms,
// etc.) now drives conflict detection too. Conflicts are declared between
// CATEGORIES, not per-product keyword pairs, so adding a new product never
// requires hand-writing a new pair — it only requires that the product's
// name contains something productCategories already recognizes (and if it
// doesn't, the fix is adding one keyword in ONE place, not four).
const CATEGORY_CONFLICT_PAIRS = [["acid-exfoliant", "retinoid"], ["vitamin-c", "retinoid"], ["benzoyl", "retinoid"], ["benzoyl", "vitamin-c"], ["niacinamide", "vitamin-c"]];
// Self-tan conflicts with anything that speeds cell turnover or otherwise
// disrupts an even fake-tan finish — every active EXCEPT niacinamide
// (gentle, doesn't accelerate turnover), preserving the exact coverage the
// old CONFLICT_PAIRS list had (it paired "self tan" against every acid/
// retinol/vitamin-c/benzoyl variant it knew about, but never niacinamide).
const SELFTAN_CONFLICTS_WITH = ["retinoid", "acid-exfoliant", "vitamin-c", "benzoyl"];
// Same-active exclusivity: unlike a cross-category conflict (different
// actives clashing), this catches two products that share the SAME active
// landing in the same session on the same day — e.g. two separate
// niacinamide serums, or two retinoids. Now derived directly from
// productCategories (the canonical classifier — see comment above) instead
// of a separately-maintained keyword list, so it can't drift out of sync
// with what Products-tab categorization already recognizes.
const ACTIVE_CATEGORY_GROUP_NAMES = {
  retinoid: "retinoid",
  vitaminc: "vitamin-c",
  niacinamide: "niacinamide",
  exfoliant: "acid-exfoliant",
  benzoyl: "benzoyl"
};
const classifyActiveGroups = p => Array.from(productCategories(p)).map(cat => ACTIVE_CATEGORY_GROUP_NAMES[cat]).filter(Boolean);
// Adds the pseudo-group "selftan" (not a productCategories ingredient
// category — self-tan is a product TYPE, from detectType, not an active
// ingredient) so a single function can answer "what does this product need
// checked against a conflict table for" regardless of whether the conflict
// driver is an active ingredient or a product type like self-tan.
const conflictGroupsFor = p => {
  const groups = classifyActiveGroups(p);
  if (detectType(p) === "selftan") groups.push("selftan");
  return groups;
};
const groupsConflict = (groupsA, groupsB) => {
  if (groupsA.includes("selftan") && groupsB.some(g => SELFTAN_CONFLICTS_WITH.includes(g))) return true;
  if (groupsB.includes("selftan") && groupsA.some(g => SELFTAN_CONFLICTS_WITH.includes(g))) return true;
  return CATEGORY_CONFLICT_PAIRS.some(([a, b]) => groupsA.includes(a) && groupsB.includes(b) || groupsA.includes(b) && groupsB.includes(a));
};
const productsConflict = (p1, p2) => groupsConflict(conflictGroupsFor(p1), conflictGroupsFor(p2));
// Not every redundancy is a chemical-conflict risk. Two toners or two
// hydrating essences on the same night won't irritate skin the way two
// retinoids would, but they're still doing the same job twice for no
// added benefit — layering toner→essence→serum is a normal, intentional
// routine; TWO toners or TWO essences the same night is just clutter.
// These "layer" types piggyback on the exact same one-per-day mechanism
// as classifyActiveGroups via classifySingletonGroups below, rather than
// needing a second, separately-maintained enforcement path.
// "cleanser" here means a water/gel/foam cleanser, NOT cleanser_oil: an
// oil cleanse followed by a water cleanse is a deliberate double cleanse
// and stays allowed (the two are different types, so they never share this
// group). What this blocks is TWO water cleansers in the same session —
// e.g. a plain gel cleanser and an exfoliating SA cleanser both landing in
// the same morning, which is just washing twice with no added benefit.
// They alternate through the existing fairness tiebreak instead.
const LAYER_SINGLETON_TYPES = new Set(["toner", "essence", "moisturizer", "cleanser"]);
// A "serum" that carries no treatment active of its own — just a
// humectant/hydrator — is functionally an essence wearing a different
// label. COSRX Snail 96 Essence and The Ordinary Marine Hyaluronics do
// the same job (this was actually already noted in the rank analysis:
// "functionally overlaps with the COSRX Snail Essence" — that reasoning
// just never got wired into scheduling until now). Scoped narrowly so a
// genuine treatment serum (vitamin C, retinol, niacinamide, an
// exfoliant) is never swept in — those already carry their own active
// group and are excluded below.
const HYDRATION_SERUM_KEYWORDS = ["hyaluronic", "hyaluronate", "marine", "snail", "centella", "ceramide"];
// A wash is on the skin for under a minute and is rinsed away before
// anything else is applied, so its actives are never simultaneously on the
// face with a leave-on treatment. Used for the two rules that are about
// what shares the skin at once (the one-active-per-session claim below and
// the scheduler's rest-night cooldown), NOT for cross-active conflicts:
// conflictGroupsFor still reports an acid cleanser's acids, so it can't
// land on the same night as a retinoid.
const isRinseOffProduct = p => ["cleanser", "cleanser_oil"].includes(detectType(p));
const classifySingletonGroups = p => {
  // An exfoliating cleanser doesn't "use up" the night's acid slot: a wash
  // and a leave-on exfoliant aren't the same step done twice, which is what
  // this exclusivity is for. Without this, a daily acid cleanser quietly
  // locked the real exfoliant rotation out of every night it ran.
  const groups = isRinseOffProduct(p) ? [] : classifyActiveGroups(p);
  const type = detectType(p);
  if (LAYER_SINGLETON_TYPES.has(type)) {
    groups.push(`layer:${type}`);
  } else if (type === "mist") {
    // A thermal-water/mist spray (detectType checks "thermal|spring
    // water|mist|spray" BEFORE the plain "toner" keyword match, so a
    // product like Avène Thermal Spring Water gets its own "mist" type
    // rather than "toner") does the same non-active hydrate-the-surface
    // job as a real toner — this surfaced as a real gap: a mist and a
    // toner were landing on the SAME PM night with nothing stopping it,
    // since "mist" was never included in LAYER_SINGLETON_TYPES and so
    // never got the one-per-session exclusivity real toners get. Grouped
    // under "layer:toner" (not a separate "layer:mist") specifically so
    // it shares exclusivity WITH toners, not just with other mists.
    groups.push("layer:toner");
  } else if (type === "serum" && groups.length === 0) {
    // A treatment-free hydrating "serum" (COSRX Snail 96 Essence is sold as
    // an essence, The Ordinary's as a serum) is an essence in all but name.
    const hay = [p.genericName, p.brandName].filter(Boolean).join(" ").toLowerCase();
    if (HYDRATION_SERUM_KEYWORDS.some(kw => hay.includes(kw))) groups.push("layer:essence");
  }
  return groups;
};
const SUGGESTIONS = ["Cleanser", "Foaming Cleanser", "Gel Cleanser", "Cream Cleanser", "Oil Cleanser", "Micellar Water", "Balm Cleanser", "Toner", "Hydrating Toner", "Essence", "Vitamin C Serum", "Vitamin C (Ascorbic Acid)", "Niacinamide Serum", "Hyaluronic Acid Serum", "Retinol", "Retinoid", "Tretinoin", "Adapalene", "Bakuchiol", "Salicylic Acid", "BHA Exfoliant", "Glycolic Acid", "AHA Exfoliant", "Lactic Acid", "Mandelic Acid", "Azelaic Acid", "Benzoyl Peroxide", "Kojic Acid", "Alpha Arbutin", "Moisturizer", "Night Cream", "Gel Moisturizer", "Barrier Cream", "Ceramide Moisturizer", "Eye Cream", "SPF 30", "SPF 50", "Mineral Sunscreen", "Chemical Sunscreen", "Tinted SPF", "Face Oil", "Rosehip Oil", "Squalane", "Jojoba Oil", "Clay Mask", "Sheet Mask", "Sleeping Mask", "Exfoliant (AHA/BHA)", "LED Light Therapy", "Microneedling", "Gua Sha", "Scalp Serum", "Scalp Treatment", "Lip Balm", "Neck Cream"];
const PRODUCT_COLORS = {
  cleanser: {
    bg: T.blueSoft,
    border: T.blue,
    text: T.blue
  },
  exfoliant: {
    bg: T.purpleSoft,
    border: T.purple,
    text: T.purple
  },
  retinol: {
    bg: T.orangeSoft,
    border: T.orange,
    text: T.orange
  },
  serum: {
    bg: T.greenSoft,
    border: T.green,
    text: T.green
  },
  moisturizer: {
    bg: "#E8D5B715",
    border: "#C4A882",
    text: "#8A6E4E"
  },
  spf: {
    bg: "#FFE08A20",
    border: "#D4A017",
    text: "#8A6010"
  },
  mask: {
    bg: T.blueSoft,
    border: T.blue,
    text: T.blue
  },
  default: {
    bg: T.accentSoft,
    border: T.accent,
    text: T.accent
  }
};
// Word-boundary keyword match — avoids false positives like "pha" matching
// inside "Pharma".
// Trailing boundary is deliberately looser than the leading one: a digit
// right after a keyword ("spf50", "aha30", "bha2", "niacinamide10%") is
// still a real, distinct ingredient mention, not a false-positive
// continuation into a longer unrelated word the way a trailing LETTER
// would be ("aha" inside "ahead", "pha" inside "phase") — so only a
// following letter blocks the match; a following digit doesn't. Confirmed
// live gaps from the stricter version: "SPF50" never matched "spf" (so an
// SPF product got zero anti-aging concern-score credit and could
// misclassify via findRule's generic serum/essence rule instead of the
// dedicated SPF rule), and "AHA30+BHA2" never matched "aha"/"bha" via
// productCategories (masked only because "peeling" happened to also be in
// that particular product's name — a same-family product without that
// extra word would've gone completely uncategorized).
const hasKeyword = (text, kw) => new RegExp(`(^|[^a-z0-9])${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-z]|$)`, "i").test(text);
// Every keyword-matching text builder below deliberately uses ONLY
// genericName + brandName, NOT p.notes. notes often contains internal
// migration-tracking prose (e.g. "...exfoliant_mask_rotation_v1...") whose
// underscore-delimited words satisfy hasKeyword's word-boundary regex just
// as well as real product-name text — id 30's notes containing "_mask_"
// was one keystroke away from silently reclassifying an exfoliant as a
// mask on its next normalize pass. Fixed by step_order_repair_v2's audit;
// keep notes out of `text` in any new matcher added here.

// ─── PRODUCT CATEGORIES (ported from the Claude.ai version's detectType, so
// both apps group products the same way) ───────────────────────────────────
const INGREDIENT_CATEGORIES = {
  retinoid: ["retinol", "retinoid", "retinal", "retinaldehyde", "tretinoin", "tretinoina", "ret-avit", "adapalene", "tazarotene", "retin-a", "retinyl", "vitamin a", "a313", "pommade"],
  exfoliant: ["aha", "bha", "pha", "glycolic", "lactic", "salicylic", "mandelic", "azelaic", "exfoliant", "exfoliating", "peeling", "peel", "microfoliant", "enzyme"],
  vitaminc: ["vitamin c", "ascorbic", "ascorbyl"],
  niacinamide: ["niacinamide", "nicotinamide"],
  benzoyl: ["benzoyl peroxide", "benzoyl"]
};
const productCategories = p => {
  const hay = [p.genericName, p.brandName].filter(Boolean).join(" ").toLowerCase();
  const cats = new Set();
  for (const cat in INGREDIENT_CATEGORIES) if (INGREDIENT_CATEGORIES[cat].some(k => hasKeyword(hay, k))) cats.add(cat);
  return cats;
};
const detectType = p => {
  const hay = [p.genericName, p.brandName].filter(Boolean).join(" ").toLowerCase();
  if (/spf|sunscreen|sun serum|sun cream/.test(hay)) return "spf";
  if (/self.?tan/.test(hay)) return "selftan";
  if (/lip/.test(hay)) return "lip";
  if (/mask|masque/.test(hay)) return "mask";
  if (/cleansing oil|cleansing balm/.test(hay)) return "cleanser_oil";
  if (/cleanser|cleansing|face wash|facial wash|soap|foaming/.test(hay)) return "cleanser";
  const cats = productCategories(p);
  if (cats.has("exfoliant")) return "exfoliant";
  if (cats.has("retinoid")) return "retinoid";
  if (cats.has("vitaminc")) return "vitc";
  if (cats.has("niacinamide")) return "niacinamide";
  if (/thermal|spring water|mist|spray/.test(hay)) return "mist";
  if (/moisturi|water gel|gel cream|effaclar mat|red bean/.test(hay)) return "moisturizer";
  if (/eye/.test(hay)) return "eye";
  if (/bio-oil|face oil|facial oil|vitamin e|squalane|jojoba|rosehip/.test(hay)) return "faceoil";
  if (/toner/.test(hay)) return "toner";
  if (/essence/.test(hay)) return "essence";
  if (/serum/.test(hay)) return "serum";
  // A hydrator that names neither "essence" nor "serum" — The Ordinary's
  // "Marine Hyaluronics" is the live example — used to fall through to
  // "other" and lose BOTH the essence step slot and the one-essence-per-
  // night exclusivity (classifySingletonGroups only looked for hydration
  // keywords on type "serum"). That silently broke
  // rotate_hyaluronics_essence_v1, whose whole premise was that the Snail
  // Essence and Marine Hyaluronics alternate: with no shared group they
  // could land on the same night, and the "other" step order put the
  // hydrator in the wrong place in the sequence. Classifying it here fixes
  // the group, the ordering, and the category badge from one place instead
  // of special-casing each. Reached only after every active/cleanser/
  // moisturizer/toner branch above has already claimed its own products,
  // so a real treatment serum or a ceramide cream can't be swept in.
  if (HYDRATION_SERUM_KEYWORDS.some(kw => hay.includes(kw))) return "essence";
  return "other";
};
const CATEGORY_GROUP_MAP = {
  cleanser: "Cleansers", cleanser_oil: "Cleansers",
  toner: "Toners", mist: "Toners",
  essence: "Essences",
  vitc: "Vitamin C", niacinamide: "Niacinamide",
  exfoliant: "Exfoliants", retinoid: "Retinoids",
  serum: "Serums", eye: "Eye Care",
  mask: "Masks", faceoil: "Face Oils",
  moisturizer: "Moisturizers", lip: "Lip Care",
  selftan: "Self-Tan", spf: "SPF",
  other: "Other"
};
const CATEGORY_DISPLAY_ORDER = ["Cleansers", "Toners", "Essences", "Vitamin C", "Niacinamide", "Exfoliants", "Retinoids", "Serums", "Eye Care", "Masks", "Face Oils", "Moisturizers", "Lip Care", "Self-Tan", "SPF", "Other"];
const productCategoryGroup = p => CATEGORY_GROUP_MAP[detectType(p)] || "Other";
// ─── CANONICAL STEP ORDER (single source of truth) ─────────────────────────
// Israel's diagnosis of a bug that kept coming back (serum rendering AFTER
// moisturizer, cleanser after toner, sunscreen mid-routine): the root cause
// was that each product carried its OWN stored `stepOrder`, and that stored
// value WON over the canonical scale (the old `p.stepOrder ||
// classifyStepOrder(p)`). Drag-to-reorder then wrote a flat 10/20/30…
// renumbering onto every product in the dragged day — permanently, globally,
// across every other day — so one drag could silently put a serum above a
// moisturizer forever. Each occurrence needed its own one-shot repair
// migration (step_order_repair_v1/v2, step_order_normalize_v1-v4), and since
// migrations only run once, the very next drag re-broke it.
// The fix is structural, not another repair pass: order within a session is
// now DERIVED from the product's category every time it's rendered, and is
// not storable on the product at all. A category's position is fixed here;
// a product cannot hold a number that contradicts it. That makes this entire
// bug class unrepresentable rather than merely corrected-for-now.
// Values match the AUTO_SCHEDULE_RULES scale exactly, so nothing about the
// intended layering changes — only where the number comes from. Intra-
// category ordering that genuinely matters is encoded as distinct
// categories: cleanser_oil (10) deliberately sorts before cleanser (15), so
// a double cleanse runs oil-first, water-based-second.
const CATEGORY_STEP_ORDER = {
  cleanser_oil: 10,
  cleanser: 15,
  toner: 20,
  mist: 20,
  vitc: 35,
  niacinamide: 35,
  exfoliant: 40,
  retinoid: 45,
  essence: 50,
  serum: 50,
  eye: 55,
  mask: 60,
  faceoil: 65,
  moisturizer: 75,
  lip: 85,
  selftan: 88,
  spf: 95,
  other: 50
};
// The canonical position for a product, derived purely from its category.
// Deliberately ignores p.stepOrder — see CATEGORY_STEP_ORDER above.
const canonicalStepOrder = p => CATEGORY_STEP_ORDER[detectType(p)] ?? 50;
// The step cap is about how much you're asking your FACE to absorb in one
// session. Lip balm isn't on that skin, competes with nothing, conflicts
// with nothing — so it shouldn't push a real step off the day. It is
// therefore scheduled and shown like any other step, but is invisible to
// the cap: it neither consumes a slot nor counts in the "too many steps"
// warning. Expressed once here so every cap site (the scheduler's budget,
// the add-step bump, the health check) stays consistent.
const CAP_EXEMPT_TYPES = new Set(["lip"]);
const countsTowardCap = p => !!p && !CAP_EXEMPT_TYPES.has(detectType(p));
const capLoad = prods => (prods || []).filter(countsTowardCap).length;
// Per-day, per-session manual order set by dragging a row in that day's
// list. Stored on the profile keyed by "YYYY-MM-DD:session" and scoped to
// that ONE day — it never touches the product, so it cannot leak into any
// other day or into the canonical scale. Products not named in an override
// keep their canonical position relative to each other, sorted after the
// explicitly-ordered ones.
const dayOrderKey = (ds, session) => `${ds}:${session}`;
// ─── PM TREATMENTS (procedures) ────────────────────────────────────────────
// User-logged PM treatments that aren't products: microneedling and red /
// near-infrared LED. Deliberately NOT auto-suggested or auto-scheduled —
// Israel adds one on the night he actually did it, and the routine adapts
// around it. They are stored as dated events on the profile
// (profile.procedures) rather than as products, because they have no place
// in the layering order and no due-date/rotation behaviour; what they have
// is a recovery window.
// The two are deliberately treated DIFFERENTLY, not lumped together as
// "treatments":
//   • microneedling physically breaches the barrier, so retinoids and acid
//     exfoliants are blocked the same night AND the following night
//     (blockNights: 2, counting the night of the treatment) — at-home
//     0.25-0.5mm depth, per Israel's stated use.
//   • red/near-infrared LED is non-ablative: it doesn't disrupt the barrier
//     and has no recovery window, so it blocks nothing (blockNights: 0).
//     Blocking actives around it would cost active nights for no clinical
//     reason. It's tracked only, so "when did I last do it" is answerable.
const PROCEDURE_TYPES = {
  microneedling: {
    label: "Microneedling",
    icon: "🪡",
    blockNights: 2,
    note: "At-home derma-stamp/roller (0.25–0.5mm). Blocks retinoids and acid exfoliants tonight and tomorrow night."
  },
  redlight: {
    label: "Red / Infrared LED",
    icon: "🔆",
    blockNights: 0,
    note: "Non-ablative — no recovery window, so it doesn't hold back actives. Tracked only."
  }
};
const proceduresOn = (profile, ds) => (profile?.procedures || []).filter(x => x.date === ds);
// True if an active (retinoid / acid exfoliant) must be held back on `ds`
// because of a procedure's recovery window. A procedure with blockNights: n
// covers its own night plus the following n-1 nights.
const activesBlockedOn = (profile, ds) => (profile?.procedures || []).some(x => {
  const def = PROCEDURE_TYPES[x.type];
  if (!def || !def.blockNights) return false;
  if (!x.date || !/^\d{4}-\d{2}-\d{2}$/.test(x.date) || !ds) return false;
  const gap = daysBetween(x.date, ds);
  return gap >= 0 && gap < def.blockNights;
});
// Most recent logged occurrence of a procedure type, or null.
const lastProcedure = (profile, type) => (profile?.procedures || []).filter(x => x.type === type).map(x => x.date).sort().pop() || null;
const dayOrderFor = (profile, ds, session) => (profile?.dayOrder || {})[dayOrderKey(ds, session)] || null;
// Sorts a day's products: an explicit per-day drag order first (if one
// exists for this exact day+session), otherwise the canonical category
// order. Ties inside a category fall back to product id so the result is
// stable rather than dependent on array order.
const sortForDay = (prods, profile, ds, session) => {
  const canon = (a, b) => canonicalStepOrder(a) - canonicalStepOrder(b) || String(a.id).localeCompare(String(b.id));
  const override = dayOrderFor(profile, ds, session);
  if (!Array.isArray(override) || !override.length) return [...prods].sort(canon);
  // Products named in the override keep the dragged order. Anything NOT
  // named (a step added after the drag, or a product that newly became due)
  // used to sort after every named product regardless of category, so a
  // cleanser or toner added later landed at the bottom. Each such product is
  // now slotted in at its canonical position among the named ones instead.
  const seen = new Set();
  const out = [];
  override.forEach(id => {
    const p = prods.find(x => x.id === id);
    if (p && !seen.has(id)) {
      seen.add(id);
      out.push(p);
    }
  });
  prods.filter(p => !seen.has(p.id)).sort(canon).forEach(e => {
    const at = out.findIndex(o => canonicalStepOrder(o) > canonicalStepOrder(e));
    out.splice(at === -1 ? out.length : at, 0, e);
  });
  return out;
};

  others.forEach(other => {

    const singletonClash = classifySingletonGroups(other).some(g => newGroups.includes(g));
