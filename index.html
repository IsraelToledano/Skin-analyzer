<!-- React + ReactDOM (UMD production builds) — no Babel needed, JSX is pre-compiled below -->

<script>
  // Visible failure handling: if React/ReactDOM fail to load (CDN blocked, network issue),
  // or if the app throws while mounting, show the actual error instead of a silent blank screen.
  window.addEventListener('error', function(e){
    var el = document.getElementById('boot-error');
    if(el){
      el.style.display = 'block';
      el.textContent = 'Error: ' + (e.message || e.error || 'unknown') +
        (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '');
    }
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(typeof React === 'undefined' || typeof ReactDOM === 'undefined'){
        var el = document.getElementById('boot-error');
        if(el){
          el.style.display = 'block';
          el.textContent = 'React failed to load from unpkg.com.\nCheck your internet connection and try again.\nIf this keeps happening, your network may be blocking unpkg.com.';
        }
      }
    }, 4000);
  });
</script>

<script>
const {
  useState,
  useRef,
  useEffect,
  useCallback,
  useMemo
} = React;

// ─── THEME (matches the Claude.ai / Skin Ritual artifact) ─────────────────────
const T = {
  bg: "#FAF7F4",
  card: "#FFFFFF",
  border: "#EDE8E3",
  accent: "#E8837A",
  accentSoft: "#E8837A18",
  peach: "#F2A98A",
  peachSoft: "#F2A98A15",
  text: "#2C2420",
  muted: "#9E8E87",
  faint: "#F5F0EC",
  green: "#5BAA82",
  greenSoft: "#5BAA8215",
  red: "#D95F5F",
  redSoft: "#D95F5F12",
  blue: "#6B9FBF",
  blueSoft: "#6B9FBF15",
  purple: "#9B8ABF",
  purpleSoft: "#9B8ABF15",
  orange: "#E8A87A",
  orangeSoft: "#E8A87A15",
  shadow: "0 2px 12px rgba(44,36,32,0.07)",
  shadowMd: "0 4px 24px rgba(44,36,32,0.12)"
};

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const STORAGE_KEY = "skinritual_v4"; // same key/version as the Claude.ai version's export format
// Bump this on every push so it's obvious whether a device has the latest code.
// Format: YYYY-MM-DD.N (N = push count that day, resets each day)
const APP_VERSION = "2026-08-26.2";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const SKIN_TYPES = ["Dry", "Oily", "Combination", "Normal", "Sensitive", "Acne-prone"];
const CONCERNS = ["Acne / Breakouts", "Blackheads / Whiteheads", "Oiliness", "Dryness / Flakiness", "Sensitivity / Redness", "Hyperpigmentation", "Dark spots / Melasma", "Fine lines / Wrinkles", "Enlarged pores", "Dullness / Texture", "Dark circles", "Sagging / Firmness", "Rosacea", "Eczema / Psoriasis", "Scarring"];
const FREQS = {
  daily: "Daily",
  "twice-weekly": "2×/week",
  weekly: "Weekly",
  "bi-weekly": "Every 2 wks",
  monthly: "Monthly",
  "6-weekly": "Every 6 wks",
  "8-weekly": "Every 8 wks"
};
const FREQ_DAYS = {
  daily: 1,
  "twice-weekly": 3,
  weekly: 7,
  "bi-weekly": 14,
  monthly: 30,
  "6-weekly": 42,
  "8-weekly": 56
};
const CONFLICT_PAIRS = [["glycolic acid", "retinol"], ["aha", "retinol"], ["bha", "retinol"], ["lactic acid", "retinol"], ["salicylic acid", "retinol"], ["vitamin c", "retinol"], ["ascorbic acid", "retinol"], ["benzoyl peroxide", "retinol"], ["benzoyl peroxide", "vitamin c"], ["glycolic acid", "lactic acid"], ["aha", "bha"], ["niacinamide", "vitamin c"]];
// Same-active exclusivity: unlike CONFLICT_PAIRS (which only warns about
// DIFFERENT actives clashing), this catches two products that share the
// SAME active landing in the same session on the same day — e.g. two
// separate niacinamide serums, or two retinoids. Text-matched against
// name/notes, same as AUTO_SCHEDULE_RULES, so a product only gets tagged
// if its active is actually named somewhere in its genericName, brandName,
// or notes — a product whose notes don't mention its active won't be
// caught here.
const ACTIVE_GROUP_RULES = [{
  group: "retinoid",
  keywords: ["retinol", "retinoid", "tretinoin", "adapalene", "bakuchiol", "retinal", "retinyl"]
}, {
  group: "vitamin-c",
  keywords: ["vitamin c", "ascorbic acid"]
}, {
  group: "niacinamide",
  keywords: ["niacinamide"]
}, {
  group: "acid-exfoliant",
  keywords: ["glycolic acid", "glycolic", "aha", "bha", "pha", "lactic acid", "lactic", "salicylic acid", "salicylic", "mandelic acid", "mandelic"]
}];
const classifyActiveGroups = p => {
  const text = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ");
  return ACTIVE_GROUP_RULES.filter(rule => rule.keywords.some(kw => hasKeyword(text, kw))).map(rule => rule.group);
};
const SUGGESTIONS = ["Cleanser", "Foaming Cleanser", "Gel Cleanser", "Cream Cleanser", "Oil Cleanser", "Micellar Water", "Balm Cleanser", "Toner", "Hydrating Toner", "Essence", "Vitamin C Serum", "Vitamin C (Ascorbic Acid)", "Niacinamide Serum", "Hyaluronic Acid Serum", "Retinol", "Retinoid", "Tretinoin", "Adapalene", "Bakuchiol", "Salicylic Acid", "BHA Exfoliant", "Glycolic Acid", "AHA Exfoliant", "Lactic Acid", "Mandelic Acid", "Azelaic Acid", "Benzoyl Peroxide", "Kojic Acid", "Alpha Arbutin", "Moisturizer", "Night Cream", "Gel Moisturizer", "Barrier Cream", "Ceramide Moisturizer", "Eye Cream", "SPF 30", "SPF 50", "Mineral Sunscreen", "Chemical Sunscreen", "Tinted SPF", "Face Oil", "Rosehip Oil", "Squalane", "Jojoba Oil", "Clay Mask", "Sheet Mask", "Sleeping Mask", "Exfoliant (AHA/BHA)", "LED Light Therapy", "Microneedling", "Gua Sha", "Scalp Serum", "Scalp Treatment", "Lip Balm", "Neck Cream"];
const PRODUCT_COLORS = {
  cleanser: {
    bg: T.blueSoft,
    border: T.blue,
    text: T.blue
  },
  exfoliant: {
    bg: T.purpleSoft,
    border: T.purple,
    text: T.purple
  },
  retinol: {
    bg: T.orangeSoft,
    border: T.orange,
    text: T.orange
  },
  serum: {
    bg: T.greenSoft,
    border: T.green,
    text: T.green
  },
  moisturizer: {
    bg: "#E8D5B715",
    border: "#C4A882",
    text: "#8A6E4E"
  },
  spf: {
    bg: "#FFE08A20",
    border: "#D4A017",
    text: "#8A6010"
  },
  mask: {
    bg: T.blueSoft,
    border: T.blue,
    text: T.blue
  },
  default: {
    bg: T.accentSoft,
    border: T.accent,
    text: T.accent
  }
};
// Word-boundary keyword match — avoids false positives like "pha" matching
// inside "Pharma".
const hasKeyword = (text, kw) => new RegExp(`(^|[^a-z0-9])${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-z0-9]|$)`, "i").test(text);

// ─── RULE-BASED AUTO-SCHEDULER (no AI) ─────────────────────────────────────
// Suggests session + frequency for an unscheduled product from its name/
// notes, using conservative dermatologist-style defaults. Order matters —
// checked top to bottom, first match wins.
//
// `step` values all live on ONE shared canonical scale (see below) so a
// product added today sorts correctly against products added months ago —
// previously this table used its own 10-90 range that collided with
// hand-set legacy step numbers (1-10), scrambling routine order whenever
// an Auto-Scheduled product landed between older manually-ordered ones.
//
// Canonical stage order: cleanse (oil) → cleanse (gel/wash) → tone/mist →
// AM actives (vit C / niacinamide) → exfoliant/acid → retinoid → serum/
// essence → eye cream → mask → face oil → moisturizer → lip → self-tan →
// SPF (always last, AM only).
const AUTO_SCHEDULE_RULES = [
  { keywords: ["spf", "sunscreen"], session: "am", frequency: "daily", step: 95 },
  { keywords: ["self tan", "self-tan", "tanning"], session: "pm", frequency: "weekly", step: 88 },
  { keywords: ["lip mask", "lip balm"], session: "pm", frequency: "daily", step: 85 },
  { keywords: ["cleansing oil", "oil cleanser"], session: "pm", frequency: "daily", step: 10 },
  { keywords: ["sheet mask", "clay mask", "sleeping mask", "mask", "clay"], session: "pm", frequency: "weekly", step: 60 },
  { keywords: ["cleanser", "cleansing", "wash", "micellar"], session: "both", frequency: "daily", step: 15 },
  { keywords: ["toner", "thermal water", "spring water", "mist"], session: "both", frequency: "daily", step: 20 },
  { keywords: ["vitamin c", "ascorbic acid"], session: "am", frequency: "twice-weekly", step: 35 },
  { keywords: ["niacinamide"], session: "am", frequency: "daily", step: 35 },
  { keywords: ["glycolic acid", "glycolic", "aha", "bha", "pha", "lactic acid", "salicylic acid", "mandelic acid", "exfoliant", "exfoliating", "peeling"], session: "pm", frequency: "weekly", step: 40 },
  { keywords: ["retinol", "retinoid", "tretinoin", "adapalene", "bakuchiol"], session: "pm", frequency: "weekly", step: 45 },
  { keywords: ["serum", "essence", "hyaluronic", "snail", "centella"], session: "pm", frequency: "daily", step: 50 },
  { keywords: ["eye cream"], session: "both", frequency: "daily", step: 55 },
  // Heavy occlusives (mineral-oil-based body/scar oils) checked before the
  // generic "oil" catch-all below — nightly full-face use of these compounds
  // for oily/acne-prone/combination skin risks clogged pores, so default to
  // targeted, less-frequent use rather than a daily step.
  { keywords: ["bio-oil", "bio oil", "mineral oil", "petrolatum", "vitamin e"], session: "pm", frequency: "twice-weekly", step: 65 },
  { keywords: ["face oil", "rosehip", "squalane", "jojoba", "oil"], session: "pm", frequency: "daily", step: 65 },
  { keywords: ["moisturizer", "night cream", "cream", "lotion", "barrier", "ceramide"], session: "both", frequency: "daily", step: 75 }
];
const suggestSchedule = p => {
  const text = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ");
  for (const rule of AUTO_SCHEDULE_RULES) {
    if (rule.keywords.some(kw => hasKeyword(text, kw))) {
      return {
        session: rule.session,
        frequency: rule.frequency,
        stepOrder: rule.step
      };
    }
  }
  // Fallback: no recognizable category — conservative PM/weekly so it
  // doesn't crowd the daily cap, and it's obviously flagged for review.
  return {
    session: "pm",
    frequency: "weekly",
    stepOrder: 50
  };
};
// Classifies a product's canonical step number ONLY (session/frequency are
// left alone — those are already user-configured for existing products).
// Returns null if nothing matches, so callers can choose to leave the
// existing value untouched rather than clobbering a deliberate custom order.
const classifyStepOrder = p => {
  const text = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ");
  for (const rule of AUTO_SCHEDULE_RULES) {
    if (rule.keywords.some(kw => hasKeyword(text, kw))) return rule.step;
  }
  return null;
};
// Recommended stepOrder for a product that hasn't been manually positioned
// yet: keep an existing manually-set value untouched, otherwise fall back
// to the keyword-classified canonical stage, otherwise a neutral mid-scale
// default (matches suggestSchedule's own fallback) so a brand-new product
// lands in a sensible spot instead of always sorting first/last.
const recommendStepOrder = p => p.stepOrder || classifyStepOrder(p) || 50;
// Returns the first matching AUTO_SCHEDULE_RULES entry for a product, or
// null if unclassified. Shared by the auto-scheduler and the recommendation
// scorer so "what session/type is this product" is defined in one place.
const findRule = p => {
  const text = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ");
  return AUTO_SCHEDULE_RULES.find(rule => rule.keywords.some(kw => hasKeyword(text, kw))) || null;
};

// ─── RECOMMENDATION SCORING (for Swap / Add Step) ──────────────────────────
// Concern → ingredient/type keywords a derm would target that concern with.
const CONCERN_KEYWORDS = {
  "Oiliness": ["niacinamide", "salicylic", "bha", "clay", "tea tree", "charcoal", "mattif", "sebum", "witch hazel"],
  "Blackheads / Whiteheads": ["salicylic", "bha", "clay", "charcoal", "retinol", "retinoid", "tretinoin", "adapalene"],
  "Enlarged pores": ["niacinamide", "salicylic", "bha", "clay", "retinol", "retinoid", "tretinoin"],
  "Scarring": ["vitamin c", "ascorbic acid", "retinol", "retinoid", "tretinoin", "niacinamide", "rosehip", "centella", "snail", "azelaic"]
};
// Heavy occlusives: comedogenic-leaning, mineral-oil-style bases. Nightly
// full-face use fights an oily/pore-prone routine rather than helping it.
const HEAVY_OCCLUSIVE_KEYWORDS = ["bio-oil", "bio oil", "mineral oil", "petrolatum", "vaseline"];
// Lighter facial oils — generally fine daily even on combination/oily skin,
// so they get a much smaller caution rather than a hard penalty.
const LIGHT_OIL_KEYWORDS = ["squalane", "jojoba", "rosehip", "face oil"];
const OILINESS_CONCERNS = ["Oiliness", "Blackheads / Whiteheads", "Enlarged pores"];
// Scores how well `product` fits a specific session/day slot for this
// profile — higher is more recommended. Used to sort the Swap/Add picker.
// `otherActiveProducts` = products already occupying that same session on
// that date (excluding the slot being replaced), used for conflict checks.
const scoreCandidate = (product, {
  session,
  ds,
  profile,
  otherActiveProducts = []
}) => {
  const text = [product.genericName, product.brandName, product.notes].filter(Boolean).join(" ").toLowerCase();
  const concerns = profile?.concerns || [];
  let score = 0;

  // 1. Concern match — up to 3 matched concerns counted.
  let concernMatches = 0;
  concerns.forEach(c => {
    const kws = CONCERN_KEYWORDS[c];
    if (kws && kws.some(kw => hasKeyword(text, kw))) concernMatches++;
  });
  score += Math.min(concernMatches, 3) * 25;

  // 2. Session fit, from the same rule table the auto-scheduler uses.
  const rule = findRule(product);
  if (rule) {
    if (rule.session === "both") score += 10;else if (rule.session === session) score += 15;else score -= 50;
  } else {
    score -= 5; // unclassified — let other factors decide, don't rank it up blind
  }

  // 3. Occlusive caution, weighted by whether oiliness/pores are a concern.
  const hasOilConcern = concerns.some(c => OILINESS_CONCERNS.includes(c));
  if (HEAVY_OCCLUSIVE_KEYWORDS.some(kw => hasKeyword(text, kw))) {
    score += hasOilConcern ? -40 : -10;
  } else if (LIGHT_OIL_KEYWORDS.some(kw => hasKeyword(text, kw))) {
    score += hasOilConcern ? -5 : 0;
  }

  // 4. Conflict penalty against what's already active in this session today.
  otherActiveProducts.forEach(other => {
    if (other.id === product.id) return;
    const otherText = [other.genericName, other.brandName, other.notes].filter(Boolean).join(" ").toLowerCase();
    CONFLICT_PAIRS.forEach(([a, b]) => {
      const matchesPair = hasKeyword(text, a) && hasKeyword(otherText, b) || hasKeyword(text, b) && hasKeyword(otherText, a);
      if (matchesPair) score -= 60;
    });
  });

  // 5. Overdue bonus for products already on a schedule — mildly favors
  // swapping in something that's actually due soon over something fresh.
  if (product.scheduled && product.nextDate) {
    const since = daysBetween(product.nextDate, ds);
    score += Math.max(0, Math.min(since, 14)) * 1.5;
  }
  return score;
};

const pcolor = p => {
  const g = (p.genericName || "").toLowerCase();
  if (g.includes("cleanser") || g.includes("wash")) return PRODUCT_COLORS.cleanser;
  if (g.includes("exfoliant") || g.includes("aha") || g.includes("bha") || g.includes("acid")) return PRODUCT_COLORS.exfoliant;
  if (g.includes("retinol") || g.includes("retinoid") || g.includes("tretinoin")) return PRODUCT_COLORS.retinol;
  if (g.includes("serum") || g.includes("vitamin c") || g.includes("niacinamide")) return PRODUCT_COLORS.serum;
  if (g.includes("moisturizer") || g.includes("cream") || g.includes("lotion")) return PRODUCT_COLORS.moisturizer;
  if (g.includes("spf") || g.includes("sunscreen")) return PRODUCT_COLORS.spf;
  if (g.includes("mask")) return PRODUCT_COLORS.mask;
  return PRODUCT_COLORS.default;
};
const productMatches = (p, kw) => [p.genericName, p.brandName, p.notes].some(f => f && f.toLowerCase().includes(kw.toLowerCase()));
const findConflicts = products => {
  const out = [];
  for (let i = 0; i < products.length; i++) for (let j = i + 1; j < products.length; j++) for (const [a, b] of CONFLICT_PAIRS) if (productMatches(products[i], a) && productMatches(products[j], b) || productMatches(products[i], b) && productMatches(products[j], a)) out.push({
    p1: products[i],
    p2: products[j],
    pair: [a, b]
  });
  return out;
};

// ─── DATE HELPERS ──────────────────────────────────────────────────────────────
// Local-component based (NOT toISOString/UTC) so the date string always
// matches the device's own calendar day, regardless of timezone offset or
// time of day. toISOString() converts through UTC first, which silently
// shifts local-midnight-anchored dates back a day in any positive-UTC-offset
// timezone (e.g. Israel, UTC+2/+3) — that mismatch was why the calendar's
// day keys stopped lining up with the scheduler's day keys and every day
// showed "Nothing scheduled."
const dateStr = d => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayStr = () => dateStr(new Date());
const parseDate = s => {
  const d = new Date(s + "T12:00:00");
  return isNaN(d) ? null : d;
};
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
const fmtLong = d => d.toLocaleDateString("en-US", {
  weekday: "long",
  month: "long",
  day: "numeric"
});
const fmtShort = d => d.toLocaleDateString("en-US", {
  month: "short",
  day: "numeric"
});
const scheduledDates = (p, from, to) => {
  if (!p.nextDate) return [];
  const fs = dateStr(from),
    ts = dateStr(to);
  if (p.isOneOff) {
    const d = parseDate(p.nextDate);
    if (!d) return [];
    const ds = dateStr(d);
    return ds >= fs && ds <= ts ? [ds] : [];
  }
  const start = parseDate(p.nextDate);
  if (!start) return [];
  const iv = FREQ_DAYS[p.frequency] || 1;
  const dates = [];
  let cur = new Date(start);
  while (dateStr(cur) < fs) cur = addDays(cur, iv);
  while (dateStr(cur) > fs) cur = addDays(cur, -iv);
  while (dateStr(cur) <= ts) {
    if (dateStr(cur) >= fs) dates.push(dateStr(cur));
    cur = addDays(cur, iv);
  }
  return dates;
};

// ─── EMPTY PROFILE ─────────────────────────────────────────────────────────────
// On the phone version, products start empty — use Sync to pull your products
// in from the Claude.ai version (see README).
const EMPTY_PROFILE = {
  id: 1,
  name: "My Profile",
  type: "Combination",
  concerns: ["Oiliness", "Blackheads / Whiteheads", "Enlarged pores", "Scarring"],
  notes: "",
  products: [],
  analysisText: "",
  analysisGaps: [],
  logs: [],
  skinImgs: [],
  pins: [] // manual per-day swap/add overrides — see buildSessionSchedule step 1b
};

// ─── STORAGE (real localStorage — persists properly on this device) ───────────
const hydrateImgs = (imgs = []) => imgs.map(img => {
  if (!img?.b64) return null;
  try {
    const bytes = atob(img.b64);
    const arr = new Uint8Array(bytes.length);
    for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], {
      type: img.mime || "image/jpeg"
    });
    return {
      ...img,
      preview: URL.createObjectURL(blob)
    };
  } catch (e) {
    return null;
  }
}).filter(Boolean);
const parseProfileData = (raw, skinImgs = null) => {
  try {
    const data = typeof raw === "string" ? JSON.parse(raw) : raw;
    const p = data?.profile || data;
    if (!p || typeof p !== "object") return null;
    const imgs = skinImgs !== null ? skinImgs : p.skinImgs || [];
    return {
      ...EMPTY_PROFILE,
      ...p,
      products: p.products || [],
      skinImgs: hydrateImgs(imgs)
    };
  } catch (e) {
    return null;
  }
};
const load = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data?.profile) {
      const parsed = parseProfileData(data);
      const migrated = applyMigrations(parsed);
      if (migrated && migrated !== parsed) save(migrated);
      return migrated;
    }
  } catch (e) {}
  return null;
};
