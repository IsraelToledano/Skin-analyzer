<!-- React + ReactDOM (UMD production builds) — no Babel needed, JSX is pre-compiled below -->

<script>
  // Visible failure handling: if React/ReactDOM fail to load (CDN blocked, network issue),
  // or if the app throws while mounting, show the actual error instead of a silent blank screen.
  window.addEventListener('error', function(e){
    var el = document.getElementById('boot-error');
    if(el){
      el.style.display = 'block';
      el.textContent = 'Error: ' + (e.message || e.error || 'unknown') +
        (e.filename ? ('\n' + e.filename + ':' + e.lineno) : '');
    }
  });
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(typeof React === 'undefined' || typeof ReactDOM === 'undefined'){
        var el = document.getElementById('boot-error');
        if(el){
          el.style.display = 'block';
          el.textContent = 'React failed to load from unpkg.com.\nCheck your internet connection and try again.\nIf this keeps happening, your network may be blocking unpkg.com.';
        }
      }
    }, 4000);
  });
</script>

<script>
const {

// ─── THEME (matches the Claude.ai / Skin Ritual artifact) ─────────────────────
const T = {

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const STORAGE_KEY = "skinritual_v4"; // same key/version as the Claude.ai version's export format

const APP_VERSION = "2026-08-30.8";
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

const CONCERNS = ["Acne / Breakouts", "Blackheads / Whiteheads", "Oiliness", "Dryness / Flakiness", "Sensitivity / Redness", "Hyperpigmentation", "Dark spots / Melasma", "Fine lines / Wrinkles", "Enlarged pores", "Dullness / Texture", "Dark circles", "Sagging / Firmness", "Rosacea", "Eczema / Psoriasis", "Scarring"];
const FREQS = {

  "twice-weekly": "2×/week",
  weekly: "Weekly",
  "bi-weekly": "Every 2 wks",
  monthly: "Monthly",
  "6-weekly": "Every 6 wks",

const FREQ_DAYS = {

  "twice-weekly": 3,
  weekly: 7,

const CONFLICT_PAIRS = [["glycolic acid", "retinol"], ["aha", "retinol"], ["bha", "retinol"], ["lactic acid", "retinol"], ["salicylic acid", "retinol"], ["vitamin c", "retinol"], ["ascorbic acid", "retinol"], ["benzoyl peroxide", "retinol"], ["benzoyl peroxide", "vitamin c"], ["glycolic acid", "lactic acid"], ["aha", "bha"], ["niacinamide", "vitamin c"], ["self tan", "retinol"], ["self tan", "glycolic acid"], ["self tan", "aha"], ["self tan", "bha"], ["self tan", "lactic acid"], ["self tan", "salicylic acid"], ["self tan", "mandelic acid"], ["self tan", "vitamin c"], ["self tan", "ascorbic acid"], ["self tan", "benzoyl peroxide"]];
// Same-active exclusivity: unlike CONFLICT_PAIRS (which only warns about
// DIFFERENT actives clashing), this catches two products that share the
// SAME active landing in the same session on the same day — e.g. two
// separate niacinamide serums, or two retinoids. Text-matched against
// name/notes, same as AUTO_SCHEDULE_RULES, so a product only gets tagged
// if its active is actually named somewhere in its genericName, brandName,
// or notes — a product whose notes don't mention its active won't be
// caught here.
const ACTIVE_GROUP_RULES = [{
  group: "retinoid",
  keywords: ["retinol", "retinoid", "tretinoin", "adapalene", "bakuchiol", "retinal", "retinyl"]
}, {
  group: "vitamin-c",
  keywords: ["vitamin c", "ascorbic acid"]
}, {
  group: "niacinamide",
  keywords: ["niacinamide"]
}, {
  // Renamed in spirit from "acid-exfoliant" — now covers physical/
  // mechanical exfoliants too (microfoliant, powder exfoliant, enzyme
  // peels), not just named acids. Layering a physical scrub on top of an
  // AHA/BHA/salicylic product the same night is the classic
  // over-exfoliation mistake, and the narrower acid-only list let it
  // through since a product like "Daily Microfoliant" never mentions any
  // acid by name.
  group: "acid-exfoliant",
  keywords: ["glycolic acid", "glycolic", "aha", "bha", "pha", "lactic acid", "lactic", "salicylic acid", "salicylic", "mandelic acid", "mandelic", "exfoliant", "exfoliating", "exfoliator", "microfoliant", "peeling", "enzyme"]
}];
const classifyActiveGroups = p => {
  const text = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ");
  return ACTIVE_GROUP_RULES.filter(rule => rule.keywords.some(kw => hasKeyword(text, kw))).map(rule => rule.group);
};
// Not every redundancy is a chemical-conflict risk. Two toners or two
// hydrating essences on the same night won't irritate skin the way two
// retinoids would, but they're still doing the same job twice for no
// added benefit — layering toner→essence→serum is a normal, intentional
// routine; TWO toners or TWO essences the same night is just clutter.
// These "layer" types piggyback on the exact same one-per-day mechanism
// as ACTIVE_GROUP_RULES via classifySingletonGroups below, rather than
// needing a second, separately-maintained enforcement path.
const LAYER_SINGLETON_TYPES = new Set(["toner", "essence", "moisturizer"]);
// A "serum" that carries no treatment active of its own — just a
// humectant/hydrator — is functionally an essence wearing a different
// label. COSRX Snail 96 Essence and The Ordinary Marine Hyaluronics do
// the same job (this was actually already noted in the rank analysis:
// "functionally overlaps with the COSRX Snail Essence" — that reasoning
// just never got wired into scheduling until now). Scoped narrowly so a
// genuine treatment serum (vitamin C, retinol, niacinamide, an
// exfoliant) is never swept in — those already carry their own active
// group and are excluded below.
const HYDRATION_SERUM_KEYWORDS = ["hyaluronic", "hyaluronate", "marine", "snail", "centella", "ceramide"];
const classifySingletonGroups = p => {
  const groups = classifyActiveGroups(p);
  const type = detectType(p);
  if (LAYER_SINGLETON_TYPES.has(type)) {
    groups.push(`layer:${type}`);
  } else if (type === "mist") {
    // A thermal-water/mist spray (detectType checks "thermal|spring
    // water|mist|spray" BEFORE the plain "toner" keyword match, so a
    // product like Avène Thermal Spring Water gets its own "mist" type
    // rather than "toner") does the same non-active hydrate-the-surface
    // job as a real toner — this surfaced as a real gap: a mist and a
    // toner were landing on the SAME PM night with nothing stopping it,
    // since "mist" was never included in LAYER_SINGLETON_TYPES and so
    // never got the one-per-session exclusivity real toners get. Grouped
    // under "layer:toner" (not a separate "layer:mist") specifically so
    // it shares exclusivity WITH toners, not just with other mists.
    groups.push("layer:toner");
  } else if (type === "serum" && groups.length === 0) {
    const hay = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ").toLowerCase();
    if (HYDRATION_SERUM_KEYWORDS.some(kw => hay.includes(kw))) groups.push("layer:essence");
  }
  return groups;
};
const SUGGESTIONS = ["Cleanser", "Foaming Cleanser", "Gel Cleanser", "Cream Cleanser", "Oil Cleanser", "Micellar Water", "Balm Cleanser", "Toner", "Hydrating Toner", "Essence", "Vitamin C Serum", "Vitamin C (Ascorbic Acid)", "Niacinamide Serum", "Hyaluronic Acid Serum", "Retinol", "Retinoid", "Tretinoin", "Adapalene", "Bakuchiol", "Salicylic Acid", "BHA Exfoliant", "Glycolic Acid", "AHA Exfoliant", "Lactic Acid", "Mandelic Acid", "Azelaic Acid", "Benzoyl Peroxide", "Kojic Acid", "Alpha Arbutin", "Moisturizer", "Night Cream", "Gel Moisturizer", "Barrier Cream", "Ceramide Moisturizer", "Eye Cream", "SPF 30", "SPF 50", "Mineral Sunscreen", "Chemical Sunscreen", "Tinted SPF", "Face Oil", "Rosehip Oil", "Squalane", "Jojoba Oil", "Clay Mask", "Sheet Mask", "Sleeping Mask", "Exfoliant (AHA/BHA)", "LED Light Therapy", "Microneedling", "Gua Sha", "Scalp Serum", "Scalp Treatment", "Lip Balm", "Neck Cream"];
const PRODUCT_COLORS = {

  },

  },

  },

// Word-boundary keyword match — avoids false positives like "pha" matching
// inside "Pharma".
const hasKeyword = (text, kw) => new RegExp(`(^|[^a-z0-9])${kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-z0-9]|$)`, "i").test(text);

// ─── PRODUCT CATEGORIES (ported from the Claude.ai version's detectType, so
// both apps group products the same way) ───────────────────────────────────
const INGREDIENT_CATEGORIES = {
  retinoid: ["retinol", "retinoid", "retinal", "retinaldehyde", "tretinoin", "tretinoina", "ret-avit", "adapalene", "tazarotene", "retin-a", "retinyl", "vitamin a", "a313", "pommade"],
  exfoliant: ["aha", "bha", "pha", "glycolic", "lactic", "salicylic", "mandelic", "azelaic", "exfoliant", "exfoliating", "peeling", "peel", "microfoliant", "enzyme"],
  vitaminc: ["vitamin c", "ascorbic", "ascorbyl"],
  niacinamide: ["niacinamide", "nicotinamide"],
  benzoyl: ["benzoyl peroxide", "benzoyl"]
};
const productCategories = p => {
  const hay = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ").toLowerCase();
  const cats = new Set();
  for (const cat in INGREDIENT_CATEGORIES) if (INGREDIENT_CATEGORIES[cat].some(k => hasKeyword(hay, k))) cats.add(cat);
  return cats;
};
const detectType = p => {
  const hay = [p.genericName, p.brandName].filter(Boolean).join(" ").toLowerCase();
  if (/spf|sunscreen|sun serum|sun cream/.test(hay)) return "spf";
  if (/self.?tan/.test(hay)) return "selftan";
  if (/lip/.test(hay)) return "lip";
  if (/mask/.test(hay)) return "mask";
  if (/cleansing oil|cleansing balm/.test(hay)) return "cleanser_oil";
  if (/cleanser|cleansing|face wash|facial wash|soap|foaming/.test(hay)) return "cleanser";
  const cats = productCategories(p);
  if (cats.has("exfoliant")) return "exfoliant";
  if (cats.has("retinoid")) return "retinoid";
  if (cats.has("vitaminc")) return "vitc";
  if (cats.has("niacinamide")) return "niacinamide";
  if (/thermal|spring water|mist|spray/.test(hay)) return "mist";
  if (/moisturi|water gel|gel cream|effaclar mat|red bean/.test(hay)) return "moisturizer";
  if (/eye/.test(hay)) return "eye";
  if (/bio-oil|face oil|facial oil|vitamin e|squalane|jojoba|rosehip/.test(hay)) return "faceoil";
  if (/toner/.test(hay)) return "toner";
  if (/essence/.test(hay)) return "essence";
  if (/serum/.test(hay)) return "serum";
  return "other";
};
const CATEGORY_GROUP_MAP = {
  cleanser: "Cleansers", cleanser_oil: "Cleansers",
  toner: "Toners", mist: "Toners",
  essence: "Essences",
  vitc: "Vitamin C", niacinamide: "Niacinamide",
  exfoliant: "Exfoliants", retinoid: "Retinoids",
  serum: "Serums", eye: "Eye Care",
  mask: "Masks", faceoil: "Face Oils",

const CATEGORY_DISPLAY_ORDER = ["Cleansers", "Toners", "Essences", "Vitamin C", "Niacinamide", "Exfoliants", "Retinoids", "Serums", "Eye Care", "Masks", "Face Oils", "Moisturizers", "Lip Care", "Self-Tan", "SPF", "Other"];
const productCategoryGroup = p => CATEGORY_GROUP_MAP[detectType(p)] || "Other";
// One distinct color per category, used for the category tag pill and the
// row's leading dot. Kept separate from RANK_STYLE's palette (green/blue/

const CATEGORY_COLORS = {

  "Essences": "#9B8ABF",
  "Vitamin C": "#E8A83F",

  "Exfoliants": "#C77DBF",
  "Retinoids": "#E8A87A",

  "Masks": "#C97B63",

const getProductRank = p => {
  const byId = RANK_DATA.find(r => r.id === p.id);
  if (byId) return byId;
  const hay = [p.genericName, p.brandName, p.notes].filter(Boolean).join(" ").toLowerCase();
  const matched = RANK_DATA.find(r => r.match.every(kw => hay.includes(kw)));
  if (matched) return matched;
  // Not part of the analyzed roster (e.g. added after the review ran) —
  // default to Good rather than leaving it in limbo. Nothing here claims a
  // specific clinical reason since it hasn't actually been reviewed.
  return { tag: "good", reason: "Added after the last product review — not yet individually assessed." };
};

// ─── RULE-BASED AUTO-SCHEDULER (no AI) ─────────────────────────────────────
// Suggests session + frequency for an unscheduled product from its name/
// notes, using conservative dermatologist-style defaults. Order matters —
// checked top to bottom, first match wins.
//
// `step` values all live on ONE shared canonical scale (see below) so a
// product added today sorts correctly against products added months ago —
// previously this table used its own 10-90 range that collided with
// hand-set legacy step numbers (1-10), scrambling routine order whenever
// an Auto-Scheduled product landed between older manually-ordered ones.
//
// Canonical stage order: cleanse (oil) → cleanse (gel/wash) → tone/mist →
// AM actives (vit C / niacinamide) → exfoliant/acid → retinoid → serum/
// essence → eye cream → mask → face oil → moisturizer → lip → self-tan →
// SPF (always last, AM only).
const AUTO_SCHEDULE_RULES = [
  { keywords: ["spf", "sunscreen"], session: "am", frequency: "daily", step: 95 },
  { keywords: ["self tan", "self-tan", "tanning"], session: "pm", frequency: "weekly", step: 88 },
  { keywords: ["lip mask", "lip balm"], session: "pm", frequency: "daily", step: 85 },

const CONCERN_KEYWORDS = {
  "Oiliness": ["niacinamide", "salicylic", "bha", "clay", "tea tree", "charcoal", "mattif", "sebum", "witch hazel"],
  "Blackheads / Whiteheads": ["salicylic", "bha", "clay", "charcoal", "retinol", "retinoid", "tretinoin", "adapalene"],
  "Enlarged pores": ["niacinamide", "salicylic", "bha", "clay", "retinol", "retinoid", "tretinoin"],
  "Scarring": ["vitamin c", "ascorbic acid", "retinol", "retinoid", "tretinoin", "niacinamide", "rosehip", "centella", "snail", "azelaic"]

// Heavy occlusives: comedogenic-leaning, mineral-oil-style bases. Nightly
// full-face use fights an oily/pore-prone routine rather than helping it.
const HEAVY_OCCLUSIVE_KEYWORDS = ["bio-oil", "bio oil", "mineral oil", "petrolatum", "vaseline"];
// Lighter facial oils — generally fine daily even on combination/oily skin,
// so they get a much smaller caution rather than a hard penalty.
const LIGHT_OIL_KEYWORDS = ["squalane", "jojoba", "rosehip", "face oil"];
const OILINESS_CONCERNS = ["Oiliness", "Blackheads / Whiteheads", "Enlarged pores"];
// Scores how well `product` fits a specific session/day slot for this
// profile — higher is more recommended. Used to sort the Swap/Add picker.
// `otherActiveProducts` = products already occupying that same session on
// that date (excluding the slot being replaced), used for conflict checks.
const scoreCandidate = (product, {
  session,
  ds,
  profile,
  otherActiveProducts = []
}) => {
  const text = [product.genericName, product.brandName, product.notes].filter(Boolean).join(" ").toLowerCase();
  const concerns = profile?.concerns || [];
  let score = 0;

  // 1. Concern match — up to 3 matched concerns counted.
  let concernMatches = 0;
  concerns.forEach(c => {
    const kws = CONCERN_KEYWORDS[c];
    if (kws && kws.some(kw => hasKeyword(text, kw))) concernMatches++;
  });
  score += Math.min(concernMatches, 3) * 25;

  // 2. Session fit, from the same rule table the auto-scheduler uses.
  const rule = findRule(product);
  if (rule) {
    if (rule.session === "both") score += 10;else if (rule.session === session) score += 15;else score -= 50;
  } else {
    score -= 5; // unclassified — let other factors decide, don't rank it up blind
  }

  // 3. Occlusive caution, weighted by whether oiliness/pores are a concern.
  const hasOilConcern = concerns.some(c => OILINESS_CONCERNS.includes(c));
  if (HEAVY_OCCLUSIVE_KEYWORDS.some(kw => hasKeyword(text, kw))) {
    score += hasOilConcern ? -40 : -10;
  } else if (LIGHT_OIL_KEYWORDS.some(kw => hasKeyword(text, kw))) {
    score += hasOilConcern ? -5 : 0;
  }

  // 4. Conflict penalty against what's already active in this session today.
  otherActiveProducts.forEach(other => {
    if (other.id === product.id) return;
    const otherText = [other.genericName, other.brandName, other.notes].filter(Boolean).join(" ").toLowerCase();
    CONFLICT_PAIRS.forEach(([a, b]) => {
      const matchesPair = hasKeyword(text, a) && hasKeyword(otherText, b) || hasKeyword(text, b) && hasKeyword(otherText, a);
      if (matchesPair) score -= 60;
    });
  });

  // 5. Overdue bonus for products already on a schedule — mildly favors
  // swapping in something that's actually due soon over something fresh.
  if (product.scheduled && product.nextDate) {
    const since = daysBetween(product.nextDate, ds);
    score += Math.max(0, Math.min(since, 14)) * 1.5;
  }
  return score;
};

// ─── DATE HELPERS ──────────────────────────────────────────────────────────────
// Local-component based (NOT toISOString/UTC) so the date string always
// matches the device's own calendar day, regardless of timezone offset or
// time of day. toISOString() converts through UTC first, which silently
// shifts local-midnight-anchored dates back a day in any positive-UTC-offset
// timezone (e.g. Israel, UTC+2/+3) — that mismatch was why the calendar's
// day keys stopped lining up with the scheduler's day keys and every day
// showed "Nothing scheduled."
const dateStr = d => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayStr = () => dateStr(appToday());
const parseDate = s => {
  const d = new Date(s + "T12:00:00");
  return isNaN(d) ? null : d;
};
const addDays = (d, n) => {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
};
// The day doesn't roll over at midnight — it rolls over at 2am, so
// finishing the PM routine after midnight still counts as tonight rather
// than jumping the calendar to tomorrow. `appToday()`/`appHour()` are the
// shifted versions of "today"/"the current hour" and should be used
// anywhere the app decides which calendar day is "today" or whether it's
// currently the AM or PM window — real Date.now()/new Date() elsewhere
// (log ids, actual timestamps) are left alone.
const DAY_ROLLOVER_HOUR = 2;
const appToday = () => {
  const now = new Date();
  const shifted = now.getHours() < DAY_ROLLOVER_HOUR ? addDays(now, -1) : now;
  return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate());
};
const appHour = () => {
  const h = new Date().getHours();
  return h < DAY_ROLLOVER_HOUR ? h + 24 : h;
};
const fmtLong = d => d.toLocaleDateString("en-US", {
  weekday: "long",
  month: "long",
  day: "numeric"
});
const fmtShort = d => d.toLocaleDateString("en-US", {
  month: "short",
  day: "numeric"
});
const scheduledDates = (p, from, to) => {
  if (!p.nextDate) return [];
  const fs = dateStr(from),
    ts = dateStr(to);
  if (p.isOneOff) {
    const d = parseDate(p.nextDate);
    if (!d) return [];
    const ds = dateStr(d);
    return ds >= fs && ds <= ts ? [ds] : [];
  }
  const start = parseDate(p.nextDate);
  if (!start) return [];
  const iv = FREQ_DAYS[p.frequency] || 1;
  const dates = [];
  let cur = new Date(start);
  while (dateStr(cur) < fs) cur = addDays(cur, iv);
  while (dateStr(cur) > fs) cur = addDays(cur, -iv);
  while (dateStr(cur) <= ts) {
    if (dateStr(cur) >= fs) dates.push(dateStr(cur));
    cur = addDays(cur, iv);
  }
  return dates;
};
